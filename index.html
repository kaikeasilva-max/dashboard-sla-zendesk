<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>DASHBOARD SLA / ZENDESK</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
@media print {
  button { display: none; }
}
</style>

</head>

<body class="bg-slate-100">

<div class="max-w-7xl mx-auto p-6">

  <!-- HEADER -->
  <h1 class="text-3xl font-bold mb-2">📊 DASHBOARD SLA / ZENDESK</h1>
  <p class="text-slate-500 mb-6">Visão operacional e executiva</p>

  <!-- BOTÃO PDF -->
  <button onclick="gerarPDF()" class="bg-black text-white px-4 py-2 rounded mb-6">
    📄 Baixar PDF
  </button>

  <!-- CARDS -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">

    <div class="bg-white p-5 rounded-xl shadow">
      <p>📦 Entrada</p>
      <h2 id="entrada" class="text-3xl font-bold">0</h2>
    </div>

    <div class="bg-white p-5 rounded-xl shadow">
      <p>🟢 Finalizados</p>
      <h2 id="finalizados" class="text-3xl font-bold">0</h2>
    </div>

    <div class="bg-white p-5 rounded-xl shadow">
      <p>🟡 Pendentes</p>
      <h2 id="pendentes" class="text-3xl font-bold">0</h2>
    </div>

    <div class="bg-white p-5 rounded-xl shadow">
      <p>🔴 Fora do Prazo</p>
      <h2 id="fora" class="text-3xl font-bold">0</h2>
    </div>

  </div>

  <!-- SLA + STATUS -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <div class="bg-white p-5 rounded-xl shadow">
      <h3 class="font-bold mb-3">SLA</h3>
      <canvas id="chartSLA"></canvas>
    </div>

    <div class="bg-white p-5 rounded-xl shadow">
      <h3 class="font-bold mb-3">Operação</h3>
      <canvas id="chartStatus"></canvas>
    </div>

  </div>

  <!-- RESPONSÁVEIS -->
  <div class="bg-white p-5 rounded-xl shadow mt-6">
    <h3 class="font-bold mb-3">👤 Responsáveis (Dentro vs Fora)</h3>
    <canvas id="chartResp"></canvas>
  </div>

  <!-- ALERTA 5 DIAS -->
  <div class="bg-red-100 border border-red-500 p-4 rounded-xl mt-6">
    <h3 class="font-bold text-red-600">⚠ Tickets acima de 5 dias</h3>
    <p id="lista5"></p>
  </div>

</div>

<script>

const url = "https://docs.google.com/spreadsheets/d/1CafyeUwLEROswxB5RQvN8Jpt2F5VjvagpXxjF8NuK2Y/export?format=csv";

let rawData = [];

fetch(url)
.then(r => r.text())
.then(data => {

  rawData = data.split("\n").slice(1);

  render(rawData);

});

function render(linhas) {

  let entrada = 0;
  let finalizados = 0;
  let pendentes = 0;
  let fora = 0;
  let dentro = 0;

  let respDentro = {};
  let respFora = {};
  let tickets5dias = [];

  linhas.forEach(l => {

    const c = l.split(",");

    if (!c[0]) return;

    let ticket = c[0];
    let responsavel = c[4];
    let sla = c[6];
    let dataEntrada = new Date(c[2]);

    // cards
    entrada += Number(c[8] || 0);
    finalizados += Number(c[9] || 0);
    pendentes += Number(c[10] || 0);

    if (sla?.includes("FORA")) fora++;
    if (sla?.includes("DENTRO")) dentro++;

    // responsável
    if (responsavel) {

      if (sla?.includes("DENTRO")) {
        respDentro[responsavel] = (respDentro[responsavel] || 0) + 1;
      }

      if (sla?.includes("FORA")) {
        respFora[responsavel] = (respFora[responsavel] || 0) + 1;
      }
    }

    // +5 dias
    if (dataEntrada) {
      let hoje = new Date();
      let diff = Math.floor((hoje - dataEntrada) / (1000 * 60 * 60 * 24));

      if (diff > 5) {
        tickets5dias.push(ticket);
      }
    }

  });

  // CARDS
  document.getElementById("entrada").innerText = entrada;
  document.getElementById("finalizados").innerText = finalizados;
  document.getElementById("pendentes").innerText = pendentes;
  document.getElementById("fora").innerText = fora;

  // ALERTA 5 DIAS
  document.getElementById("lista5").innerText =
    tickets5dias.length ? tickets5dias.join(", ") : "Nenhum ticket crítico";

  // SLA
  new Chart(document.getElementById("chartSLA"), {
    type: "doughnut",
    data: {
      labels: ["Dentro", "Fora"],
      datasets: [{ data: [dentro, fora] }]
    }
  });

  // STATUS
  new Chart(document.getElementById("chartStatus"), {
    type: "bar",
    data: {
      labels: ["Entrada", "Finalizados", "Pendentes"],
      datasets: [{ data: [entrada, finalizados, pendentes] }]
    }
  });

  // RESPONSÁVEIS
  new Chart(document.getElementById("chartResp"), {
    type: "bar",
    data: {
      labels: Object.keys(respDentro),
      datasets: [
        {
          label: "Dentro do Prazo",
          data: Object.values(respDentro)
        },
        {
          label: "Fora do Prazo",
          data: Object.keys(respDentro).map(k => respFora[k] || 0)
        }
      ]
    }
  });

}

// PDF
function gerarPDF() {
  window.print();
}

</script>

</body>
</html>
