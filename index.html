<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>DASHBOARD SLA/ZENDESK</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 p-6">

  <div class="max-w-7xl mx-auto">

    <h1 class="text-3xl font-bold mb-6">DASHBOARD SLA/ZENDESK</h1>

    <!-- CARDS -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">

      <div class="bg-white p-4 rounded-xl shadow">
        <p>Total Tickets</p>
        <h2 id="total">0</h2>
      </div>

      <div class="bg-white p-4 rounded-xl shadow">
        <p>Finalizados</p>
        <h2 id="finalizados">0</h2>
      </div>

      <div class="bg-white p-4 rounded-xl shadow">
        <p>Pendentes</p>
        <h2 id="pendentes">0</h2>
      </div>

      <div class="bg-white p-4 rounded-xl shadow">
        <p>SLA Fora do Prazo</p>
        <h2 id="sla">0</h2>
      </div>

    </div>

    <div class="bg-white p-6 rounded-xl shadow">
      <h2 class="font-bold mb-4">Tabela (dados base)</h2>
      <pre id="tabela">Carregando...</pre>
    </div>

  </div>

<script>
const url = "https://docs.google.com/spreadsheets/d/1CafyeUwLEROswxB5RQvN8Jpt2F5VjvagpXxjF8NuK2Y/export?format=csv";

fetch(url)
  .then(res => res.text())
  .then(data => {
    const linhas = data.split("\n").slice(1);

    let total = 0;
    let finalizados = 0;
    let pendentes = 0;
    let sla = 0;

    let tabela = "";

    linhas.forEach(l => {
      const cols = l.split(",");

      if (!cols[0]) return;

      total++;

      const status = cols[5];
      const sla_status = cols[6];

      if (status && status.includes("Finalizado")) finalizados++;
      else pendentes++;

      if (sla_status && sla_status.includes("FORA")) sla++;
    });

    document.getElementById("total").innerText = total;
    document.getElementById("finalizados").innerText = finalizados;
    document.getElementById("pendentes").innerText = pendentes;
    document.getElementById("sla").innerText = sla;

    document.getElementById("tabela").innerText = data;
  });
</script>

</body>
</html>
