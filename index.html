<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>📊 DASHBOARD SLA / ZENDESK</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
.card { transition: 0.3s; }
.card:hover { transform: scale(1.03); }

@media print {
  button, input { display: none; }
}
</style>
</head>

<body class="bg-slate-100">

<div class="max-w-7xl mx-auto p-6">

<!-- HEADER -->
<div class="mb-4">
  <h1 class="text-3xl font-bold">📊 DASHBOARD SLA / ZENDESK</h1>
  <p class="text-slate-500">Visão executiva</p>
</div>

<!-- FILTRO INTERVALO -->
<div class="flex gap-3 items-center mb-6">

  <input type="date" id="dataInicio" class="p-2 border rounded">
  <input type="date" id="dataFim" class="p-2 border rounded">

  <button onclick="aplicarFiltro()" class="bg-black text-white px-4 py-2 rounded">
    🔎 Filtrar período
  </button>

  <button onclick="resetFiltro()" class="bg-gray-500 text-white px-4 py-2 rounded">
    Reset
  </button>

  <button onclick="gerarPDF()" class="bg-blue-600 text-white px-4 py-2 rounded">
    📄 PDF
  </button>

</div>

<!-- PAINEL EXECUTIVO -->
<div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6">

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>📦 Total</p>
    <h2 id="total" class="text-2xl font-bold">0</h2>
  </div>

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>🟢 Finalizados</p>
    <h2 id="finalizados" class="text-2xl font-bold">0</h2>
  </div>

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>🟡 Pendentes</p>
    <h2 id="pendentes" class="text-2xl font-bold">0</h2>
  </div>

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>🔴 Fora SLA</p>
    <h2 id="fora" class="text-2xl font-bold">0</h2>
  </div>

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>⚠ Críticos +5d</p>
    <h2 id="critico" class="text-2xl font-bold">0</h2>
  </div>

</div>

<!-- GRÁFICOS -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">

  <div class="bg-white p-5 rounded-xl shadow">
    <h3 class="font-bold mb-3">📈 SLA</h3>
    <canvas id="sla"></canvas>
  </div>

  <div class="bg-white p-5 rounded-xl shadow">
    <h3 class="font-bold mb-3">📊 Operação</h3>
    <canvas id="operacao"></canvas>
  </div>

</div>

<!-- EVOLUÇÃO -->
<div class="bg-white p-5 rounded-xl shadow mt-6">
  <h3 class="font-bold mb-3">📊 Tendência (SLA por dia)</h3>
  <canvas id="tendencia"></canvas>
</div>

<!-- RESPONSÁVEIS -->
<div class="bg-white p-5 rounded-xl shadow mt-6">
  <h3 class="font-bold mb-3">👤 Ranking de Responsáveis</h3>
  <canvas id="resp"></canvas>
</div>

<!-- ALERTA -->
<div class="bg-red-100 border border-red-500 p-4 rounded-xl mt-6">
  <h3 class="font-bold text-red-600">⚠ Tickets críticos (+5 dias)</h3>
  <p id="lista"></p>
</div>

</div>

<script>

const apiURL = "https://script.google.com/macros/s/AKfycbzKjRpXnOG1I3P8NA90mPYVILS_317gx_EZUuio7fMrcMwJiIjwmWYjVOqD73Hkmw2CeQ/exec";

let dadosCache = [];
let chartSLA, chartOp, chartResp, chartTrend;

// 🚀 CARREGAR API
function carregar() {

fetch(apiURL + "?t=" + new Date().getTime())
.then(r => r.json())
.then(data => {

  dadosCache = data;
  aplicarFiltro();

});

}

// 🔎 FILTRO INTERVALO
function aplicarFiltro() {

  let ini = document.getElementById("dataInicio").value;
  let fim = document.getElementById("dataFim").value;

  let base = dadosCache;

  if (ini && fim) {
    base = dadosCache.filter(d => {
      let data = new Date(d.data_dia);
      return data >= new Date(ini) && data <= new Date(fim);
    });
  }

  render(base);
}

// 🔄 RESET
function resetFiltro() {
  document.getElementById("dataInicio").value = "";
  document.getElementById("dataFim").value = "";
  render(dadosCache);
}

// 📊 RENDER EXECUTIVO
function render(dados) {

  let total = dados.length;
  let finalizados = 0;
  let pendentes = 0;
  let fora = 0;
  let dentro = 0;
  let critico = 0;

  let resp = {};
  let slaDia = {};
  let tickets = [];

  dados.forEach(d => {

    if (d.status === "finalizado" || d.status === "tabulado") finalizados++;
    else pendentes++;

    if (d.sla_status?.includes("FORA")) fora++;
    if (d.sla_status?.includes("DENTRO")) dentro++;

    let dt = new Date(d.data_entrada);
    let diff = Math.floor((new Date() - dt) / (1000*60*60*24));

    if (diff > 5) {
      critico++;
      tickets.push(d.ticket_id);
    }

    // RESPONSÁVEL
    if (d.responsavel) {
      resp[d.responsavel] = (resp[d.responsavel] || 0) + 1;
    }

    // TENDÊNCIA POR DIA
    let dia = String(d.data_dia).split("T")[0];
    slaDia[dia] = slaDia[dia] || {dentro:0, fora:0};

    if (d.sla_status?.includes("DENTRO")) slaDia[dia].dentro++;
    if (d.sla_status?.includes("FORA")) slaDia[dia].fora++;

  });

  // CARDS
  document.getElementById("total").innerText = total;
  document.getElementById("finalizados").innerText = finalizados;
  document.getElementById("pendentes").innerText = pendentes;
  document.getElementById("fora").innerText = fora;
  document.getElementById("critico").innerText = critico;

  document.getElementById("lista").innerText =
    tickets.length ? tickets.join(", ") : "Nenhum crítico";

  // SLA
  if (chartSLA) chartSLA.destroy();
  chartSLA = new Chart(document.getElementById("sla"), {
    type: "doughnut",
    data: {
      labels: ["Dentro", "Fora"],
      datasets: [{ data: [dentro, fora] }]
    }
  });

  // OPERAÇÃO
  if (chartOp) chartOp.destroy();
  chartOp = new Chart(document.getElementById("operacao"), {
    type: "bar",
    data: {
      labels: ["Total", "Finalizados", "Pendentes"],
      datasets: [{ data: [total, finalizados, pendentes] }]
    }
  });

  // RESPONSÁVEIS
  if (chartResp) chartResp.destroy();
  chartResp = new Chart(document.getElementById("resp"), {
    type: "bar",
    data: {
      labels: Object.keys(resp),
      datasets: [{
        label: "Tickets",
        data: Object.values(resp)
      }]
    }
  });

  // TENDÊNCIA
  if (chartTrend) chartTrend.destroy();

  chartTrend = new Chart(document.getElementById("tendencia"), {
    type: "line",
    data: {
      labels: Object.keys(slaDia),
      datasets: [
        {
          label: "Dentro",
          data: Object.values(slaDia).map(v => v.dentro)
        },
        {
          label: "Fora",
          data: Object.values(slaDia).map(v => v.fora)
        }
      ]
    }
  });

}

// PDF
function gerarPDF() {
  window.print();
}

// INIT
carregar();
setInterval(carregar, 30000);

</script>

</body>
</html>
