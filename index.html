<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>📊 DASHBOARD SLA / ZENDESK</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
.card { transition: 0.3s; }
.card:hover { transform: scale(1.03); }

@media print {
  button, input { display: none; }
}
</style>
</head>

<body class="bg-slate-100">

<div class="max-w-7xl mx-auto p-6">

<!-- HEADER -->
<div class="mb-4">
  <h1 class="text-3xl font-bold">📊 DASHBOARD SLA / ZENDESK</h1>
  <p class="text-slate-500">Visão executiva (Power BI Style)</p>
</div>

<!-- FILTROS POWER BI -->
<div class="flex flex-wrap gap-3 items-center mb-6">

  <button onclick="filtroRapido('hoje')" class="bg-black text-white px-3 py-2 rounded">Hoje</button>
  <button onclick="filtroRapido('ontem')" class="bg-gray-700 text-white px-3 py-2 rounded">Ontem</button>
  <button onclick="filtroRapido('7d')" class="bg-blue-600 text-white px-3 py-2 rounded">Últimos 7 dias</button>
  <button onclick="filtroRapido('30d')" class="bg-purple-600 text-white px-3 py-2 rounded">Últimos 30 dias</button>
  <button onclick="filtroRapido('mes')" class="bg-green-600 text-white px-3 py-2 rounded">Este mês</button>

  <input type="date" id="dataInicio" class="p-2 border rounded">
  <input type="date" id="dataFim" class="p-2 border rounded">

  <button onclick="aplicarFiltro()" class="bg-black text-white px-4 py-2 rounded">🔎 Filtrar</button>
  <button onclick="resetFiltro()" class="bg-gray-500 text-white px-4 py-2 rounded">Reset</button>

</div>

<!-- CARDS EXECUTIVOS -->
<div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6">

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>📦 Total</p>
    <h2 id="total" class="text-2xl font-bold">0</h2>
  </div>

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>🟢 Finalizados</p>
    <h2 id="finalizados" class="text-2xl font-bold">0</h2>
  </div>

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>🟡 Pendentes</p>
    <h2 id="pendentes" class="text-2xl font-bold">0</h2>
  </div>

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>🔴 Fora do SLA</p>
    <h2 id="fora" class="text-2xl font-bold">0</h2>
  </div>

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>⚠ Críticos +5d</p>
    <h2 id="critico" class="text-2xl font-bold">0</h2>
  </div>

</div>

<!-- GRÁFICOS -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">

  <div class="bg-white p-5 rounded-xl shadow">
    <h3 class="font-bold mb-3">📈 SLA</h3>
    <canvas id="sla"></canvas>
  </div>

  <div class="bg-white p-5 rounded-xl shadow">
    <h3 class="font-bold mb-3">📊 Operação</h3>
    <canvas id="operacao"></canvas>
  </div>

</div>

<!-- RESPONSÁVEIS -->
<div class="bg-white p-5 rounded-xl shadow mt-6">
  <h3 class="font-bold mb-3">👤 Responsáveis</h3>
  <canvas id="resp"></canvas>
</div>

<!-- ALERTA -->
<div class="bg-red-100 border border-red-500 p-4 rounded-xl mt-6">
  <h3 class="font-bold text-red-600">⚠ Tickets críticos (+5 dias)</h3>
  <p id="lista"></p>
</div>

</div>

<script>

const apiURL = "https://script.google.com/macros/s/AKfycbzKjRpXnOG1I3P8NA90mPYVILS_317gx_EZUuio7fMrcMwJiIjwmWYjVOqD73Hkmw2CeQ/exec";

let dadosCache = [];
let chartSLA, chartOp, chartResp;

function normalizarData(d){
  return String(d).split("T")[0];
}

// 🚀 CARREGAR API
function carregar() {

fetch(apiURL + "?t=" + new Date().getTime())
.then(r => r.json())
.then(data => {

  dadosCache = data;
  render(dadosCache);

});

}

// 🎯 FILTROS RÁPIDOS POWER BI
function filtroRapido(tipo){

  let hoje = new Date();
  let ini, fim;

  if(tipo === "hoje"){
    ini = fim = hoje;
  }

  if(tipo === "ontem"){
    ini = fim = new Date();
    ini.setDate(hoje.getDate() - 1);
  }

  if(tipo === "7d"){
    ini = new Date();
    ini.setDate(hoje.getDate() - 7);
    fim = hoje;
  }

  if(tipo === "30d"){
    ini = new Date();
    ini.setDate(hoje.getDate() - 30);
    fim = hoje;
  }

  if(tipo === "mes"){
    ini = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
    fim = hoje;
  }

  filtrarPorDatas(ini, fim);
}

// 📅 FILTRO INTERVALO
function filtrarPorDatas(ini, fim){

  let inicio = normalizarData(ini);
  let fimData = normalizarData(fim);

  let base = dadosCache.filter(d => {
    let data = normalizarData(d.data_dia);
    return data >= inicio && data <= fimData;
  });

  render(base);
}

// 🔎 INPUT MANUAL
function aplicarFiltro(){

  let ini = document.getElementById("dataInicio").value;
  let fim = document.getElementById("dataFim").value;

  if(!ini && !fim){
    render(dadosCache);
    return;
  }

  let base = dadosCache.filter(d => {
    let data = normalizarData(d.data_dia);

    if(ini && !fim) return data >= ini;
    if(!ini && fim) return data <= fim;

    return data >= ini && data <= fim;
  });

  render(base);
}

// 🔄 RESET
function resetFiltro(){
  document.getElementById("dataInicio").value = "";
  document.getElementById("dataFim").value = "";
  render(dadosCache);
}

// 📊 RENDER EXECUTIVO
function render(dados){

  let total = dados.length;
  let finalizados = 0;
  let pendentes = 0;
  let fora = 0;
  let dentro = 0;
  let critico = 0;

  let resp = {};
  let tickets = [];

  dados.forEach(d => {

    if(d.status === "finalizado" || d.status === "tabulado") finalizados++;
    else pendentes++;

    if(d.sla_status?.includes("FORA")) fora++;
    if(d.sla_status?.includes("DENTRO")) dentro++;

    let dt = new Date(d.data_entrada);
    let diff = Math.floor((new Date() - dt)/(1000*60*60*24));

    if(diff > 5){
      critico++;
      tickets.push(d.ticket_id);
    }

    if(d.responsavel){
      resp[d.responsavel] = (resp[d.responsavel]||0)+1;
    }

  });

  document.getElementById("total").innerText = total;
  document.getElementById("finalizados").innerText = finalizados;
  document.getElementById("pendentes").innerText = pendentes;
  document.getElementById("fora").innerText = fora;
  document.getElementById("critico").innerText = critico;

  document.getElementById("lista").innerText =
    tickets.length ? tickets.join(", ") : "Nenhum crítico";

  if(chartSLA) chartSLA.destroy();
  chartSLA = new Chart(document.getElementById("sla"), {
    type:"doughnut",
    data:{ labels:["Dentro","Fora"], datasets:[{data:[dentro,fora]}]}
  });

  if(chartOp) chartOp.destroy();
  chartOp = new Chart(document.getElementById("operacao"), {
    type:"bar",
    data:{ labels:["Total","Finalizados","Pendentes"], datasets:[{data:[total,finalizados,pendentes]}]}
  });

  if(chartResp) chartResp.destroy();
  chartResp = new Chart(document.getElementById("resp"), {
    type:"bar",
    data:{
      labels:Object.keys(resp),
      datasets:[{label:"Tickets", data:Object.values(resp)}]
    }
  });

}

// INIT
carregar();
setInterval(carregar,30000);

</script>

</body>
</html>
