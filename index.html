<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>📊 DASHBOARD SLA / ZENDESK</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script> 

<style>
.card { transition: 0.3s; cursor:pointer; }
.card:hover { transform: scale(1.03); }

@media print {
  button, input { display:none; }
}
</style>
</head>

<body class="bg-slate-100">

<div class="max-w-7xl mx-auto p-6">

<div class="mb-4">
  <h1 class="text-3xl font-bold">📊 DASHBOARD SLA / ZENDESK</h1>
  <p class="text-slate-500">Visão operacional</p>
</div>

<div class="flex gap-3 items-center mb-6">

  <input type="date" id="dataInicio" class="p-2 border rounded">
  <input type="date" id="dataFim" class="p-2 border rounded">

  <button onclick="aplicarFiltro()" class="bg-black text-white px-4 py-2 rounded">🔎 Filtrar</button>
  <button onclick="resetFiltro()" class="bg-gray-500 text-white px-4 py-2 rounded">Reset</button>
  <button onclick="gerarPDF()" class="bg-black text-white px-4 py-2 rounded">📄 Baixar PDF</button>

</div>

<div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6">

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>📦 Total (Entrada)</p>
    <h2 id="total" class="text-2xl font-bold">0</h2>
  </div>

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>🟢 Finalizados (Saída)</p>
    <h2 id="finalizados" class="text-2xl font-bold">0</h2>
  </div>

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>🟡 Pendentes</p>
    <h2 id="pendentes" class="text-2xl font-bold">0</h2>
  </div>

  <div class="card bg-white p-5 rounded-xl shadow" id="cardFora">
    <p>🔴 Fora SLA</p>
    <h2 id="fora" class="text-2xl font-bold">0</h2>
  </div>

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>⚠ +5 dias</p>
    <h2 id="critico" class="text-2xl font-bold">0</h2>
  </div>

</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">

  <div class="bg-white p-5 rounded-xl shadow">
    <h3 class="font-bold mb-3">📈 SLA</h3>
    <canvas id="sla"></canvas>
  </div>

  <div class="bg-white p-5 rounded-xl shadow">
    <h3 class="font-bold mb-3">📊 Operação</h3>
    <canvas id="operacao"></canvas>
  </div>

</div>

<div class="bg-white p-5 rounded-xl shadow mt-6">
  <h3 class="font-bold mb-3">👤 Responsáveis</h3>
  <canvas id="respChart"></canvas>
</div>

<div class="bg-red-100 border border-red-500 p-4 rounded-xl mt-6">
  <h3 class="font-bold text-red-600">⚠ Tickets críticos (+5 dias)</h3>
  <p id="lista"></p>
</div>

</div>

<div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50">
  <div class="bg-white w-3/4 max-h-[80vh] overflow-auto rounded-xl shadow-xl p-6">

    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold">📌 Tickets</h2>
      <button onclick="fecharModal()" class="text-red-600 font-bold text-xl">✕</button>
    </div>

    <div id="conteudoModal"></div>

  </div>
</div>

<script>

const apiURL = "https://script.google.com/macros/s/AKfycbzKjRpXnOG1I3P8NA90mPYVILS_317gx_EZUuio7fMrcMwJiIjwmWYjVOqD73Hkmw2CeQ/exec";

let dadosCache = [];
let chartSLA, chartOp, chartResp;

let ticketsFora = [];

function normalizar(d){
  return String(d).split("T")[0];
}

function abrirModal(lista){

  let html = lista.map(t => `
    <div class="border p-3 rounded bg-slate-50 mb-2">
      🎫 ${t.ticket_id}<br>
      👤 ${t.responsavel || "-"}<br>
      🧾 ${t["status ticket"] || t.status || "-"}
    </div>
  `).join("");

  document.getElementById("conteudoModal").innerHTML = html || "Sem dados";
  document.getElementById("modal").classList.remove("hidden");
}

function fecharModal(){
  document.getElementById("modal").classList.add("hidden");
}

function bindClicks(){
  const card = document.getElementById("cardFora");
  if(card){
    card.onclick = () => abrirModal(ticketsFora);
  }
}

function carregar(abaDestino = "principal"){
  let urlFinal = apiURL + "?t=" + new Date().getTime();
  
  // Se for solicitado o histórico, adiciona o parâmetro correspondente para a API do Google Sheets
  if(abaDestino === "historico"){
    urlFinal += "&aba=historico";
  }

  fetch(urlFinal)
  .then(r => r.json())
  .then(data => {
    dadosCache = data;
    
    let ini = document.getElementById("dataInicio").value;
    let fim = document.getElementById("dataFim").value;
    let hoje = new Date().toISOString().split('T')[0];
    
    // Se não houver data definida nos campos, força a exibição para hoje por padrão
    if (!ini && !fim) {
      document.getElementById("dataInicio").value = hoje;
      document.getElementById("dataFim").value = hoje;
    }
    
    aplicarFiltroLocal();
  });
}

function aplicarFiltro(){
  let ini = document.getElementById("dataInicio").value;
  let fim = document.getElementById("dataFim").value;
  let hoje = new Date().toISOString().split('T')[0];

  // Se o filtro for diferente de hoje, força o recarregamento chamando os dados do histórico
  if((ini && ini !== hoje) || (fim && fim !== hoje)){
    carregar("historico");
  } else {
    carregar("principal");
  }
}

function aplicarFiltroLocal(){
  let ini = document.getElementById("dataInicio").value;
  let fim = document.getElementById("dataFim").value;

  let base = dadosCache.filter(d => {
    let data = normalizar(d.data_dia);
    if(ini && data < ini) return false;
    if(fim && data > fim) return false;
    return true;
  });

  render(base);
}

function resetFiltro(){
  document.getElementById("dataInicio").value = "";
  document.getElementById("dataFim").value = "";
  carregar("principal");
}

function render(dados){

  // 🔥 REMOVE DUPLICADOS (SEM MEXER NA API)
  const mapa = new Map();
  dados.forEach(d => {
    if(!mapa.has(d.ticket_id)){
      mapa.set(d.ticket_id, d);
    }
  });
  dados = Array.from(mapa.values());

  let total = 0;
  let finalizados = 0;
  let pendentes = 0;
  let fora = 0;
  let dentro = 0;
  let critico = 0;

  let ticketsCriticos = [];
  ticketsFora = [];

  let respDentro = {};
  let respFora = {};

  dados.forEach(d => {

    total += Number(d.entrada || 0);
    finalizados += Number(d.saida || 0);
    pendentes += Number(d.pendente || 0);

    if(d.sla_status?.includes("FORA")){
      fora++;
      ticketsFora.push(d);
    }

    if(d.sla_status?.includes("DENTRO")) dentro++;

    let diff = Math.floor((new Date() - new Date(d.data_entrada)) / (1000*60*60*24));

    if(diff > 5){
      critico++;
      ticketsCriticos.push(d.ticket_id);
    }

    if(d.responsavel){
      if(d.sla_status?.includes("DENTRO")){
        respDentro[d.responsavel] = (respDentro[d.responsavel]||0)+1;
      }
      if(d.sla_status?.includes("FORA")){
        respFora[d.responsavel] = (respFora[d.responsavel]||0)+1;
      }
    }

  });

  document.getElementById("total").innerText = total;
  document.getElementById("finalizados").innerText = finalizados;
  document.getElementById("pendentes").innerText = pendentes;
  document.getElementById("fora").innerText = fora;
  document.getElementById("critico").innerText = critico;

  document.getElementById("lista").innerText =
    ticketsCriticos.length ? ticketsCriticos.join(", ") : "Nenhum crítico";

  if(chartSLA) chartSLA.destroy();
  chartSLA = new Chart(document.getElementById("sla"), {
    type:"doughnut",
    data:{ labels:["Dentro","Fora"], datasets:[{data:[dentro,fora]}] }
  });

  if(chartOp) chartOp.destroy();
  chartOp = new Chart(document.getElementById("operacao"), {
    type:"bar",
    data:{
      labels:["Entrada","Saída","Pendentes"],
      datasets:[{data:[total,finalizados,pendentes]}]
    }
  });

  if(chartResp) chartResp.destroy();

  let todos = Object.keys({...respDentro, ...respFora});

  chartResp = new Chart(document.getElementById("respChart"), {
    type:"bar",
    data:{
      labels: todos,
      datasets:[
        {
          label:"Dentro do prazo",
          data: todos.map(r => respDentro[r] || 0),
          backgroundColor:"#22c55e"
        },
        {
          label:"Fora do prazo",
          data: todos.map(r => respFora[r] || 0),
          backgroundColor:"#ef4444"
        }
      ]
    }
  });

  chartResp.options.onClick = (evt, elements) => {

    if(!elements.length) return;

    const el = elements[0];
    const label = chartResp.data.labels[el.index];
    const dataset = el.datasetIndex;

    let lista = dados.filter(d => d.responsavel === label);

    if(dataset === 0){
      lista = lista.filter(d => d.sla_status?.includes("DENTRO"));
    }

    if(dataset === 1){
      lista = lista.filter(d => d.sla_status?.includes("FORA"));
    }

    abrirModal(lista);
  };

  bindClicks();
}

function gerarPDF(){
  window.print();
}

// Inicializa buscando o dia corrente da planilha principal
carregar("principal");

// Rotina de atualização em tempo real para o dia atual de 30 em 30 segundos
setInterval(() => {
  let ini = document.getElementById("dataInicio").value;
  let fim = document.getElementById("dataFim").value;
  let hoje = new Date().toISOString().split('T')[0];
  
  // Só executa o auto-refresh se estiver visualizando o dia de hoje
  if((!ini || ini === hoje) && (!fim || fim === hoje)) {
     carregar("principal");
  }
}, 30000);

function gerarPDFAuto(){
  document.querySelectorAll("button, input").forEach(e => e.style.display = "none");
  window.print();
  setTimeout(() => location.reload(), 2000);
}

if(window.location.search.includes("pdf=1")){
  window.addEventListener("load", () => {
    setTimeout(() => gerarPDFAuto(), 1500);
  });
}
</script>
</body>
</html>
