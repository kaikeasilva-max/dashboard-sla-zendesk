<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>📊 DASHBOARD SLA / ZENDESK</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
.card { transition: 0.3s; cursor:pointer; }
.card:hover { transform: scale(1.03); }

@media print {
  button, input { display:none; }
}
</style>
</head>

<body class="bg-slate-100">

<div class="max-w-7xl mx-auto p-6">

<div class="mb-4">
  <h1 class="text-3xl font-bold">📊 DASHBOARD SLA / ZENDESK</h1>
  <p class="text-slate-500">Visão operacional</p>
</div>

<div class="flex gap-3 items-center mb-6">

  <input type="date" id="dataInicio" class="p-2 border rounded">
  <input type="date" id="dataFim" class="p-2 border rounded">

  <button onclick="aplicarFiltro()" class="bg-black text-white px-4 py-2 rounded">
    🔎 Filtrar
  </button>

  <button onclick="resetFiltro()" class="bg-gray-500 text-white px-4 py-2 rounded">
    Reset
  </button>

  <button onclick="gerarPDF()" class="bg-black text-white px-4 py-2 rounded">
    📄 Baixar PDF
  </button>

</div>

<div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6">

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>📦 Total (Entrada)</p>
    <h2 id="total" class="text-2xl font-bold">0</h2>
  </div>

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>🟢 Finalizados (Saída)</p>
    <h2 id="finalizados" class="text-2xl font-bold">0</h2>
  </div>

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>🟡 Pendentes</p>
    <h2 id="pendentes" class="text-2xl font-bold">0</h2>
  </div>

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>🔴 Fora SLA</p>
    <h2 id="fora" class="text-2xl font-bold">0</h2>
  </div>

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>⚠ +5 dias</p>
    <h2 id="critico" class="text-2xl font-bold">0</h2>
  </div>

</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">

  <div class="bg-white p-5 rounded-xl shadow">
    <h3 class="font-bold mb-3">📈 SLA</h3>
    <canvas id="sla"></canvas>
  </div>

  <div class="bg-white p-5 rounded-xl shadow">
    <h3 class="font-bold mb-3">📊 Operação</h3>
    <canvas id="operacao"></canvas>
  </div>

</div>

<div class="bg-white p-5 rounded-xl shadow mt-6">
  <h3 class="font-bold mb-3">👤 Responsáveis</h3>
  <canvas id="respDentro"></canvas>
  <canvas id="respFora" class="mt-6"></canvas>
</div>

<div class="bg-red-100 border border-red-500 p-4 rounded-xl mt-6">
  <h3 class="font-bold text-red-600">⚠ Tickets críticos (+5 dias)</h3>
  <p id="lista"></p>
</div>

</div>

<div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50">
  <div class="bg-white w-3/4 max-h-[80vh] overflow-auto rounded-xl shadow-xl p-6">

    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold">📌 Tickets</h2>
      <button onclick="fecharModal()" class="text-red-600 font-bold text-xl">✕</button>
    </div>

    <div id="conteudoModal"></div>

  </div>
</div>

<script>

const apiURL = "https://script.google.com/macros/s/AKfycbzKjRpXnOG1I3P8NA90mPYVILS_317gx_EZUuio7fMrcMwJiIjwmWYjVOqD73Hkmw2CeQ/exec";

let dadosCache = [];
let chartSLA, chartOp;
let chartRespDentro, chartRespFora;

function normalizar(d){
  return String(d).split("T")[0];
}

function abrirModal(lista){

  let html = lista.map(t => `
    <div class="border p-3 rounded bg-slate-50 mb-2">
      🎫 ${t.ticket_id}<br>
      👤 ${t.responsavel || "-"}<br>
      🧾 ${t["status ticket"] || t.status || "-"}
    </div>
  `).join("");

  document.getElementById("conteudoModal").innerHTML = html || "Sem dados";
  document.getElementById("modal").classList.remove("hidden");
}

function fecharModal(){
  document.getElementById("modal").classList.add("hidden");
}

/* DRILL DOWN CORRIGIDO */
function addClick(chart, dados, tipo){

  chart.options.onClick = (evt, el) => {
    if(!el.length) return;

    const index = el[0].index;
    const label = chart.data.labels[index];

    const lista = dados.filter(d => {

      if(tipo === "DENTRO"){
        return d.responsavel === label && d.sla_status?.includes("DENTRO");
      }

      if(tipo === "FORA"){
        return d.responsavel === label && d.sla_status?.includes("FORA");
      }

      return false;
    });

    abrirModal(lista);
  };
}

function carregar(){

fetch(apiURL + "?t=" + new Date().getTime())
.then(r => r.json())
.then(data => {
  dadosCache = data;
  render(data);
});

}

function aplicarFiltro(){

  let ini = document.getElementById("dataInicio").value;
  let fim = document.getElementById("dataFim").value;

  if(!ini && !fim){
    render(dadosCache);
    return;
  }

  let base = dadosCache.filter(d => {
    let data = normalizar(d.data_dia);
    if(ini && data < ini) return false;
    if(fim && data > fim) return false;
    return true;
  });

  render(base);
}

function resetFiltro(){
  document.getElementById("dataInicio").value = "";
  document.getElementById("dataFim").value = "";
  render(dadosCache);
}

function render(dados){

  let total = 0;
  let finalizados = 0;
  let pendentes = 0;
  let fora = 0;
  let dentro = 0;
  let critico = 0;

  let ticketsCriticos = [];
  let respDentro = {};
  let respFora = {};

  dados.forEach(d => {

    total += Number(d.entrada || 0);
    finalizados += Number(d.saida || 0);
    pendentes += Number(d.pendente || 0);

    if(d.sla_status?.includes("FORA")) fora++;
    if(d.sla_status?.includes("DENTRO")) dentro++;

    let diff = Math.floor((new Date() - new Date(d.data_entrada)) / (1000*60*60*24));

    if(diff > 5){
      critico++;
      ticketsCriticos.push(d.ticket_id);
    }

    if(d.responsavel){
      if(d.sla_status?.includes("DENTRO")){
        respDentro[d.responsavel] = (respDentro[d.responsavel]||0)+1;
      }
      if(d.sla_status?.includes("FORA")){
        respFora[d.responsavel] = (respFora[d.responsavel]||0)+1;
      }
    }

  });

  document.getElementById("total").innerText = total;
  document.getElementById("finalizados").innerText = finalizados;
  document.getElementById("pendentes").innerText = pendentes;
  document.getElementById("fora").innerText = fora;
  document.getElementById("critico").innerText = critico;

  document.getElementById("lista").innerText =
    ticketsCriticos.length ? ticketsCriticos.join(", ") : "Nenhum crítico";

  if(chartSLA) chartSLA.destroy();
  chartSLA = new Chart(document.getElementById("sla"), {
    type:"doughnut",
    data:{ labels:["Dentro","Fora"], datasets:[{data:[dentro,fora]}] }
  });

  if(chartOp) chartOp.destroy();
  chartOp = new Chart(document.getElementById("operacao"), {
    type:"bar",
    data:{
      labels:["Entrada","Saída","Pendentes"],
      datasets:[{data:[total,finalizados,pendentes]}]
    }
  });

  if(chartRespFora) chartRespFora.destroy();
  chartRespFora = new Chart(document.getElementById("respFora"), {
    type:"bar",
    data:{
      labels:Object.keys(respFora),
      datasets:[{label:"Fora do prazo", data:Object.values(respFora), backgroundColor:"#ef4444"}]
    }
  });

  if(chartRespDentro) chartRespDentro.destroy();
  chartRespDentro = new Chart(document.getElementById("respDentro"), {
    type:"bar",
    data:{
      labels:Object.keys(respDentro),
      datasets:[{label:"Dentro do prazo", data:Object.values(respDentro), backgroundColor:"#22c55e"}]
    }
  });

  // DRILL DOWN ATIVO
  addClick(chartRespDentro, dados, "DENTRO");
  addClick(chartRespFora, dados, "FORA");

}

function gerarPDF(){
  window.print();
}

carregar();
setInterval(carregar,30000);

</script>

</body>
</html>
