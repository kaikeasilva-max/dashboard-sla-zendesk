<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>📊 DASHBOARD SLA / ZENDESK</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
.card { transition: 0.3s; }
.card:hover { transform: scale(1.03); }

@media print {
  button, select { display: none; }
}
</style>

</head>

<body class="bg-slate-100">

<div class="max-w-7xl mx-auto p-6">

<!-- HEADER -->
<div class="mb-4">
  <h1 class="text-3xl font-bold">📊 DASHBOARD SLA / ZENDESK</h1>
  <p class="text-slate-500">Visão operacional</p>
</div>

<!-- CONTROLES -->
<div class="flex gap-3 items-center mb-6">

  <select id="filtro" onchange="aplicarFiltro()" class="p-2 border rounded">
    <option value="todas">Todas as datas</option>
  </select>

  <button onclick="gerarPDF()" class="bg-black text-white px-4 py-2 rounded">
    📄 Baixar PDF
  </button>

</div>

<!-- CARDS -->
<div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6">

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>📦 Total</p>
    <h2 id="total" class="text-2xl font-bold">0</h2>
  </div>

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>🟢 Finalizados</p>
    <h2 id="finalizados" class="text-2xl font-bold">0</h2>
  </div>

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>🟡 Pendentes</p>
    <h2 id="pendentes" class="text-2xl font-bold">0</h2>
  </div>

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>🔴 Fora do Prazo</p>
    <h2 id="fora" class="text-2xl font-bold">0</h2>
  </div>

  <div class="card bg-white p-5 rounded-xl shadow">
    <p>⚠ +5 Dias</p>
    <h2 id="critico" class="text-2xl font-bold">0</h2>
  </div>

</div>

<!-- GRAFICOS -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">

  <div class="bg-white p-5 rounded-xl shadow">
    <h3 class="font-bold mb-3">📈 SLA</h3>
    <canvas id="sla"></canvas>
  </div>

  <div class="bg-white p-5 rounded-xl shadow">
    <h3 class="font-bold mb-3">📊 Operação</h3>
    <canvas id="operacao"></canvas>
  </div>

</div>

<!-- RESPONSÁVEIS -->
<div class="bg-white p-5 rounded-xl shadow mt-6">
  <h3 class="font-bold mb-3">👤 Responsáveis</h3>
  <canvas id="resp"></canvas>
</div>

<!-- ALERTA -->
<div class="bg-red-100 border border-red-500 p-4 rounded-xl mt-6">
  <h3 class="font-bold text-red-600">⚠ Tickets críticos (+5 dias)</h3>
  <p id="lista"></p>
</div>

</div>

<script>

const urlBase = "https://docs.google.com/spreadsheets/d/1CafyeUwLEROswxB5RQvN8Jpt2F5VjvagpXxjF8NuK2Y/export?format=csv&gid=0";
const urlHist = "https://docs.google.com/spreadsheets/d/1CafyeUwLEROswxB5RQvN8Jpt2F5VjvagpXxjF8NuK2Y/export?format=csv&gid=HISTORICO_GID";

let dadosCache = [];
let chartSLA, chartOp, chartResp;

// CARREGAR BASE + HISTÓRICO
function carregar() {

Promise.all([
  fetch(urlBase).then(r => r.text()),
  fetch(urlHist).then(r => r.text())
])
.then(([base, hist]) => {

  const baseArr = base.split("\n").slice(1).map(l => l.split(","));
  const histArr = hist.split("\n").slice(1).map(l => l.split(","));

  // JUNÇÃO SEM DUPLICIDADE
  const mapa = new Map();

  baseArr.concat(histArr).forEach(d => {
    if (!d[0]) return;
    mapa.set(d[0], d);
  });

  dadosCache = Array.from(mapa.values());

  montarFiltro();
  aplicarFiltro();

});

}

// FILTRO
function montarFiltro() {

  let filtro = document.getElementById("filtro");

  let datas = [...new Set(dadosCache.map(d => d[11]))].filter(Boolean);

  if (filtro.options.length <= 1) {
    datas.forEach(d => {
      let opt = document.createElement("option");
      opt.value = d;
      opt.innerText = d;
      filtro.appendChild(opt);
    });
  }

}

function aplicarFiltro() {

  let f = document.getElementById("filtro").value;

  let base = dadosCache;

  if (f !== "todas") {
    base = dadosCache.filter(d => d[11] === f);
  }

  render(base);

}

// RENDER
function render(dados) {

  let total = 0;
  let finalizados = 0;
  let pendentes = 0;
  let fora = 0;
  let dentro = 0;
  let critico = 0;

  let respD = {};
  let respF = {};
  let tickets = [];

  dados.forEach(d => {

    let sla = d[6];
    let resp = d[4];

    total += Number(d[8] || 0);
    finalizados += Number(d[9] || 0);
    pendentes += Number(d[10] || 0);

    if (sla?.includes("FORA")) fora++;
    if (sla?.includes("DENTRO")) dentro++;

    let dataEntrada = new Date(d[2]);
    let diff = Math.floor((new Date() - dataEntrada) / (1000*60*60*24));

    if (diff > 5) {
      critico++;
      tickets.push(d[0]);
    }

    if (resp) {
      if (sla?.includes("DENTRO")) respD[resp] = (respD[resp] || 0) + 1;
      if (sla?.includes("FORA")) respF[resp] = (respF[resp] || 0) + 1;
    }

  });

  // CARDS
  document.getElementById("total").innerText = total;
  document.getElementById("finalizados").innerText = finalizados;
  document.getElementById("pendentes").innerText = pendentes;
  document.getElementById("fora").innerText = fora;
  document.getElementById("critico").innerText = critico;

  document.getElementById("lista").innerText =
    tickets.length ? tickets.join(", ") : "Nenhum crítico";

  // SLA
  if (chartSLA) chartSLA.destroy();
  chartSLA = new Chart(document.getElementById("sla"), {
    type: "doughnut",
    data: {
      labels: ["Dentro", "Fora"],
      datasets: [{ data: [dentro, fora] }]
    }
  });

  // OPERACAO
  if (chartOp) chartOp.destroy();
  chartOp = new Chart(document.getElementById("operacao"), {
    type: "bar",
    data: {
      labels: ["Total", "Finalizados", "Pendentes"],
      datasets: [{ data: [total, finalizados, pendentes] }]
    }
  });

  // RESPONSAVEIS
  if (chartResp) chartResp.destroy();
  chartResp = new Chart(document.getElementById("resp"), {
    type: "bar",
    data: {
      labels: Object.keys(respD),
      datasets: [
        { label: "Dentro", data: Object.values(respD) },
        { label: "Fora", data: Object.keys(respD).map(k => respF[k] || 0) }
      ]
    }
  });

}

// PDF
function gerarPDF() {
  window.print();
}

// INIT + REALTIME
carregar();
setInterval(carregar, 30000);

</script>

</body>
</html>
