<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>📊 DASHBOARD SLA / ZENDESK</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
.card { transition: 0.3s; cursor:pointer; }
.card:hover { transform: scale(1.03); }

@media print {
  button, input { display:none; }
}
</style>
</head>

<body class="bg-slate-100">

<div class="max-w-7xl mx-auto p-6">

<!-- HEADER -->
<div class="mb-4">
  <h1 class="text-3xl font-bold">📊 DASHBOARD SLA / ZENDESK</h1>
  <p class="text-slate-500">Visão operacional</p>
</div>

<!-- FILTRO -->
<div class="flex gap-3 items-center mb-6">

  <input type="date" id="dataFiltro" class="p-2 border rounded">

  <button onclick="aplicarFiltro()" class="bg-black text-white px-4 py-2 rounded">
    🔎 Filtrar
  </button>

  <button onclick="resetFiltro()" class="bg-gray-500 text-white px-4 py-2 rounded">
    Reset
  </button>

  <!-- 🔥 ADICIONADO PDF -->
  <button onclick="gerarPDF()" class="bg-black text-white px-4 py-2 rounded">
    📄 Baixar PDF
  </button>

</div>

<!-- CARDS -->
<div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6">

  <div onclick="abrirPorCard('total')" class="card bg-white p-5 rounded-xl shadow">
    <p>📦 Total (Entrada)</p>
    <h2 id="total" class="text-2xl font-bold">0</h2>
  </div>

  <div onclick="abrirPorCard('finalizados')" class="card bg-white p-5 rounded-xl shadow">
    <p>🟢 Finalizados (Saída)</p>
    <h2 id="finalizados" class="text-2xl font-bold">0</h2>
  </div>

  <div onclick="abrirPorCard('pendentes')" class="card bg-white p-5 rounded-xl shadow">
    <p>🟡 Pendentes</p>
    <h2 id="pendentes" class="text-2xl font-bold">0</h2>
  </div>

  <div onclick="abrirPorCard('fora')" class="card bg-white p-5 rounded-xl shadow">
    <p>🔴 Fora SLA</p>
    <h2 id="fora" class="text-2xl font-bold">0</h2>
  </div>

  <div onclick="abrirPorCard('critico')" class="card bg-white p-5 rounded-xl shadow">
    <p>⚠ Críticos +5d</p>
    <h2 id="critico" class="text-2xl font-bold">0</h2>
  </div>

</div>

<!-- GRÁFICOS -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">

  <div class="bg-white p-5 rounded-xl shadow">
    <h3 class="font-bold mb-3">📈 SLA</h3>
    <canvas id="sla"></canvas>
  </div>

  <div class="bg-white p-5 rounded-xl shadow">
    <h3 class="font-bold mb-3">📊 Operação</h3>
    <canvas id="operacao"></canvas>
  </div>

</div>

<!-- RESPONSÁVEIS -->
<div class="bg-white p-5 rounded-xl shadow mt-6">
  <h3 class="font-bold mb-3">👤 Responsáveis</h3>
  <canvas id="resp"></canvas>
</div>

<!-- ALERTA -->
<div class="bg-red-100 border border-red-500 p-4 rounded-xl mt-6">
  <h3 class="font-bold text-red-600">⚠ Tickets críticos (+5 dias)</h3>
  <p id="lista"></p>
</div>

</div>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50">
  <div class="bg-white w-3/4 max-h-[80vh] overflow-auto rounded-xl shadow-xl p-6">

    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold">📌 Tickets</h2>
      <button onclick="fecharModal()" class="text-red-600 font-bold text-xl">✕</button>
    </div>

    <div id="conteudoModal"></div>

  </div>
</div>

<script>

const apiURL = "https://script.google.com/macros/s/AKfycbzKjRpXnOG1I3P8NA90mPYVILS_317gx_EZUuio7fMrcMwJiIjwmWYjVOqD73Hkmw2CeQ/exec";

let dadosCache = [];
let chartSLA, chartOp, chartResp;

function normalizar(d){
  return String(d).split("T")[0];
}

// 🚀 LOAD
function carregar(){

fetch(apiURL + "?t=" + new Date().getTime())
.then(r => r.json())
.then(data => {
  dadosCache = data;
  render(data);
});

}

// 🔎 FILTRO
function aplicarFiltro(){

  let f = document.getElementById("dataFiltro").value;

  if(!f){
    render(dadosCache);
    return;
  }

  let base = dadosCache.filter(d =>
    normalizar(d.data_dia) === f
  );

  render(base);
}

function resetFiltro(){
  document.getElementById("dataFiltro").value = "";
  render(dadosCache);
}

// 📊 RENDER
function render(dados){

  let total = 0;
  let finalizados = 0;
  let pendentes = 0;
  let fora = 0;
  let dentro = 0;
  let critico = 0;

  let resp = {};
  let ticketsCriticos = [];

  dados.forEach(d => {

    total += Number(d.entrada || d[8] || 0);
    finalizados += Number(d.saida || d[9] || 0);
    pendentes += Number(d.pendente || d[10] || 0);

    if(d.sla_status?.includes("FORA")) fora++;
    if(d.sla_status?.includes("DENTRO")) dentro++;

    let diff = Math.floor((new Date() - new Date(d.data_entrada)) / (1000*60*60*24));

    if(diff > 5){
      critico++;
      ticketsCriticos.push(d);
    }

    if(d.responsavel){
      resp[d.responsavel] = (resp[d.responsavel]||0)+1;
    }

  });

  // CARDS
  document.getElementById("total").innerText = total;
  document.getElementById("finalizados").innerText = finalizados;
  document.getElementById("pendentes").innerText = pendentes;
  document.getElementById("fora").innerText = fora;
  document.getElementById("critico").innerText = critico;

  document.getElementById("lista").innerText =
    ticketsCriticos.length ? ticketsCriticos.map(t=>t.ticket_id).join(", ") : "Nenhum crítico";

  // SLA
  if(chartSLA) chartSLA.destroy();
  chartSLA = new Chart(document.getElementById("sla"), {
    type:"doughnut",
    data:{ labels:["Dentro","Fora"], datasets:[{data:[dentro,fora]}] }
  });

  // OPERAÇÃO
  if(chartOp) chartOp.destroy();
  chartOp = new Chart(document.getElementById("operacao"), {
    type:"bar",
    data:{
      labels:["Entrada","Saída","Pendentes"],
      datasets:[{data:[total,finalizados,pendentes]}]
    }
  });

  // RESPONSÁVEL
  if(chartResp) chartResp.destroy();
  chartResp = new Chart(document.getElementById("resp"), {
    type:"bar",
    data:{
      labels:Object.keys(resp),
      datasets:[{label:"Tickets", data:Object.values(resp)}]
    }
  });

}

// 📌 MODAL
function abrirModal(lista){

  let html = lista.map(t => `
    <div class="border p-3 rounded bg-slate-50 mb-2">
      🎫 ${t.ticket_id}<br>
      👤 ${t.responsavel}<br>
      📅 ${t.data_entrada}<br>
      📊 ${t.sla_status}
    </div>
  `).join("");

  document.getElementById("conteudoModal").innerHTML =
    html || "Sem dados";

  document.getElementById("modal").classList.remove("hidden");
}

function fecharModal(){
  document.getElementById("modal").classList.add("hidden");
}

// 🟢 DRILL NOS CARDS
function abrirPorCard(tipo){

  let lista = [];

  if(tipo === "total") lista = dadosCache;

  if(tipo === "finalizados"){
    lista = dadosCache.filter(d =>
      d.saida > 0 || d.status === "finalizado"
    );
  }

  if(tipo === "pendentes"){
    lista = dadosCache.filter(d =>
      !(d.saida > 0 || d.status === "finalizado")
    );
  }

  if(tipo === "fora"){
    lista = dadosCache.filter(d =>
      d.sla_status?.includes("FORA")
    );
  }

  if(tipo === "critico"){
    lista = dadosCache.filter(d =>
      Math.floor((new Date() - new Date(d.data_entrada))/(1000*60*60*24)) > 5
    );
  }

  abrirModal(lista);
}

// 📄 PDF (ADICIONADO)
function gerarPDF(){
  window.print();
}

// INIT
carregar();
setInterval(carregar,30000);

</script>

</body>
</html>
