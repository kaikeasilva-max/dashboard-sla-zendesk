<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Power BI SLA Histórico</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-slate-100">

<div class="max-w-7xl mx-auto p-6">

  <h1 class="text-3xl font-bold mb-4">📊 DASHBOARD SLA HISTÓRICO</h1>

  <!-- FILTRO DATA -->
  <div class="mb-6">
    <label class="font-bold">Filtrar por Data:</label>
    <select id="filtroData" onchange="aplicarFiltro()" class="p-2 rounded border ml-2"></select>
  </div>

  <!-- CARDS -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">

    <div class="bg-white p-5 rounded-xl shadow">
      <p>📦 Entrada</p>
      <h2 id="entrada" class="text-3xl font-bold">0</h2>
    </div>

    <div class="bg-white p-5 rounded-xl shadow">
      <p>🟢 Finalizados</p>
      <h2 id="finalizados" class="text-3xl font-bold">0</h2>
    </div>

    <div class="bg-white p-5 rounded-xl shadow">
      <p>🟡 Pendentes</p>
      <h2 id="pendentes" class="text-3xl font-bold">0</h2>
    </div>

    <div class="bg-white p-5 rounded-xl shadow">
      <p>🔴 Fora do Prazo</p>
      <h2 id="fora" class="text-3xl font-bold">0</h2>
    </div>

  </div>

  <!-- GRÁFICOS -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <div class="bg-white p-5 rounded-xl shadow">
      <h3 class="font-bold mb-3">📈 Tendência SLA (Histórico)</h3>
      <canvas id="chartTrend"></canvas>
    </div>

    <div class="bg-white p-5 rounded-xl shadow">
      <h3 class="font-bold mb-3">📊 SLA Atual</h3>
      <canvas id="chartSLA"></canvas>
    </div>

  </div>

</div>

<script>

const url = "https://docs.google.com/spreadsheets/d/1CafyeUwLEROswxB5RQvN8Jpt2F5VjvagpXxjF8NuK2Y/export?format=csv";

let raw = [];
let dadosProcessados = [];

fetch(url)
.then(r => r.text())
.then(data => {

  raw = data.split("\n").slice(1);

  processar(raw);

  montarFiltroDatas();

  aplicarFiltro();

});

function processar(linhas) {

  dadosProcessados = linhas.map(l => {

    const c = l.split(",");

    return {
      responsavel: c[4],
      sla: c[6],
      entrada: Number(c[8] || 0),
      finalizado: Number(c[9] || 0),
      pendente: Number(c[10] || 0),
      data: c[11] // Data dia
    };

  }).filter(x => x.data);

}

// FILTRO DE DATAS
function montarFiltroDatas() {

  let datas = [...new Set(dadosProcessados.map(d => d.data))];

  let select = document.getElementById("filtroData");

  select.innerHTML = `<option value="todas">Todas as Datas</option>`;

  datas.forEach(d => {
    select.innerHTML += `<option value="${d}">${d}</option>`;
  });

}

function aplicarFiltro() {

  let filtro = document.getElementById("filtroData").value;

  let dados = dadosProcessados;

  if (filtro !== "todas") {
    dados = dados.filter(d => d.data === filtro);
  }

  atualizarDashboard(dados);
}

function atualizarDashboard(dados) {

  let entrada = 0;
  let finalizados = 0;
  let pendentes = 0;
  let fora = 0;
  let dentro = 0;

  let trend = {};

  dados.forEach(d => {

    entrada += d.entrada;
    finalizados += d.finalizado;
    pendentes += d.pendente;

    if (d.sla?.includes("FORA")) fora++;
    if (d.sla?.includes("DENTRO")) dentro++;

    trend[d.data] = (trend[d.data] || 0) + (d.sla?.includes("FORA") ? 1 : 0);

  });

  // CARDS
  document.getElementById("entrada").innerText = entrada;
  document.getElementById("finalizados").innerText = finalizados;
  document.getElementById("pendentes").innerText = pendentes;
  document.getElementById("fora").innerText = fora;

  // SLA
  new Chart(document.getElementById("chartSLA"), {
    type: "doughnut",
    data: {
      labels: ["Dentro", "Fora"],
      datasets: [{ data: [dentro, fora] }]
    }
  });

  // TENDÊNCIA SLA (CURVA)
  new Chart(document.getElementById("chartTrend"), {
    type: "line",
    data: {
      labels: Object.keys(trend),
      datasets: [{
        label: "Fora do Prazo",
        data: Object.values(trend),
        borderWidth: 3
      }]
    }
  });

}

</script>

</body>
</html>
