<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>DASHBOARD SLA/ZENDESK</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-slate-100 p-6">

<div class="max-w-7xl mx-auto">

  <h1 class="text-3xl font-bold mb-6">DASHBOARD SLA / ZENDESK</h1>

  <!-- CARDS -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">

    <div class="bg-white p-5 rounded-xl shadow">
      <p class="text-slate-500">Entrada</p>
      <h2 id="entrada" class="text-3xl font-bold">0</h2>
    </div>

    <div class="bg-white p-5 rounded-xl shadow">
      <p class="text-slate-500">Finalizados</p>
      <h2 id="finalizados" class="text-3xl font-bold">0</h2>
    </div>

    <div class="bg-white p-5 rounded-xl shadow">
      <p class="text-slate-500">Pendentes</p>
      <h2 id="pendentes" class="text-3xl font-bold">0</h2>
    </div>

    <div class="bg-white p-5 rounded-xl shadow">
      <p class="text-slate-500">Fora do Prazo</p>
      <h2 id="sla" class="text-3xl font-bold">0</h2>
    </div>

  </div>

  <!-- GRÁFICOS -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <div class="bg-white p-5 rounded-xl shadow">
      <h3 class="font-bold mb-3">SLA</h3>
      <canvas id="chartSLA"></canvas>
    </div>

    <div class="bg-white p-5 rounded-xl shadow">
      <h3 class="font-bold mb-3">Status Operação</h3>
      <canvas id="chartStatus"></canvas>
    </div>

    <div class="bg-white p-5 rounded-xl shadow md:col-span-2">
      <h3 class="font-bold mb-3">Responsáveis</h3>
      <canvas id="chartResp"></canvas>
    </div>

  </div>

</div>

<script>

const url = "https://docs.google.com/spreadsheets/d/1CafyeUwLEROswxB5RQvN8Jpt2F5VjvagpXxjF8NuK2Y/export?format=csv";

fetch(url)
.then(r => r.text())
.then(data => {

  const linhas = data.split("\n").slice(1);

  let entrada = 0;
  let finalizados = 0;
  let pendentes = 0;
  let fora = 0;
  let dentro = 0;

  let respMap = {};

  linhas.forEach(l => {

    const c = l.split(",");

    if (!c[0]) return;

    // I = Entrada
    entrada += Number(c[8] || 0);

    // J = Finalizados
    finalizados += Number(c[9] || 0);

    // K = Pendentes
    pendentes += Number(c[10] || 0);

    // G = SLA
    if (c[6] && c[6].includes("FORA")) fora++;
    if (c[6] && c[6].includes("DENTRO")) dentro++;

    // E = responsável
    const resp = c[4];
    if (resp) {
      respMap[resp] = (respMap[resp] || 0) + 1;
    }

  });

  // CARDS
  document.getElementById("entrada").innerText = entrada;
  document.getElementById("finalizados").innerText = finalizados;
  document.getElementById("pendentes").innerText = pendentes;
  document.getElementById("sla").innerText = fora;

  // SLA
  new Chart(document.getElementById("chartSLA"), {
    type: "doughnut",
    data: {
      labels: ["Dentro", "Fora"],
      datasets: [{
        data: [dentro, fora]
      }]
    }
  });

  // STATUS
  new Chart(document.getElementById("chartStatus"), {
    type: "bar",
    data: {
      labels: ["Entrada", "Finalizados", "Pendentes"],
      datasets: [{
        data: [entrada, finalizados, pendentes]
      }]
    }
  });

  // RESPONSÁVEL
  new Chart(document.getElementById("chartResp"), {
    type: "bar",
    data: {
      labels: Object.keys(respMap),
      datasets: [{
        data: Object.values(respMap)
      }]
    }
  });

});

</script>

</body>
</html>
